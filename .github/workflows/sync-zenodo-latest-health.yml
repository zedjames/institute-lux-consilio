name: Keep all published scholarly papers current with Zenodo
on:
  schedule:
    - cron: '15 07 * * *'
  workflow_dispatch:
  # Run once when the synchronizer is first installed or updated, and
  # every day thereafter. Generated manuscript commits do not retrigger it.
  push:
    branches: [main]
    paths:
      - scripts/zenodo_latest_sync.py
      - scripts/build-publication-pages.mjs
      - scripts/build-program-pages.mjs
      - research/zenodo-concepts.json
      - .github/workflows/sync-zenodo-latest-health.yml
  pull_request:
    paths:
      - scripts/zenodo_latest_sync.py
      - scripts/build-publication-pages.mjs
      - scripts/build-program-pages.mjs
      - research/catalog.json
      - research/zenodo-concepts.json
      - research/site-pdfs.json
      - research/preprint-pdfs.json
      - .github/workflows/sync-zenodo-latest-health.yml

permissions:
  contents: write

concurrency:
  group: zenodo-published-all-series-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Preview published Zenodo PDF and citation updates for all indexed series without committing
        run: python3 scripts/zenodo_latest_sync.py --site ilc
      - name: Refresh static scholarly records, archive links and sitemap from audited metadata
        run: |
          node scripts/build-publication-pages.mjs
          node scripts/build-program-pages.mjs
      - name: Validate complete updated scholarly preview
        run: |
          node scripts/verify-site.mjs

  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect new Zenodo versions across all series and verify published PDF bytes
        run: python3 scripts/zenodo_latest_sync.py --site ilc
      - name: Refresh static scholarly records, archive links and sitemap from audited metadata
        run: |
          node scripts/build-publication-pages.mjs
          node scripts/build-program-pages.mjs
      - name: Validate complete updated scholarly state
        run: |
          node scripts/verify-site.mjs
      - name: Commit and push an atomic scholarly mirror update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "scholarly-zenodo-version-bot"
          git config user.email "contact@instituteluxconsilio.org"
          git add -- research/catalog.json research/site-pdfs.json assets/data/research.js
          git add -- papers/*.pdf 'publication-*.html' publications.html sitemap.xml index.html research.html research-*.html
          if git diff --cached --quiet; then
            echo "No newly published Zenodo versions."
            exit 0
          fi
          git commit -m "Sync latest published scholarly paper versions from Zenodo"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published verified Zenodo versions on main."
              exit 0
            fi
            sleep 4
          done
          echo "Could not push the scholarly version update after three attempts."
          exit 1
