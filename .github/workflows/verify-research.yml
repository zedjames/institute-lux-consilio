name: Validate public scholarly archive
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-site.mjs
      - run: python3 -m unittest discover -s tests -p "test_zenodo_sync_*.py"
      - run: python3 -m unittest discover -s tests -p "test_series_archives.py"
      - run: python3 scripts/build_series_archives.py --manifest-only
