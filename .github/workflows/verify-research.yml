name: Validate public scholarly archive
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/qg-exhibit.js
      - run: node --check assets/js/qg-inquiry.js
      - run: node --check scripts/build-research-directions.mjs
      - run: node --check scripts/build-research-relationships.mjs
      - run: node --check tests/test_research_relationships.mjs
      - run: node tests/test_research_relationships.mjs
      - run: node --check tests/test_research_directions.mjs
      - run: node --check scripts/audit-research-directions.mjs
      - run: node --check scripts/record-research-update.mjs
      - run: node --check scripts/review-research-directions.mjs
      - run: node --check tests/test_research_history.mjs
      - run: node tests/test_research_history.mjs
      - run: node tests/test_research_directions.mjs
      - name: Review research direction changes and preserve prior history
        run: node scripts/review-research-directions.mjs --base-ref ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD^' }}
      - run: node scripts/build-site-discovery.mjs
      - run: node scripts/build-program-pages.mjs
      - run: node scripts/build-research-relationships.mjs
      - run: git diff --exit-code -- research.html research/atlas/index.html research-relational-quantum-gravity.html research-kinetic-organization-biological-function.html research-gaussian-celestial.html research-health-formally-defined.html research-essence-physical-constitution.html
      - run: node scripts/verify-site.mjs
      - run: python3 scripts/verify_health_zh.py
      - run: python3 -m unittest discover -s tests -p "test_zenodo_sync_*.py"
